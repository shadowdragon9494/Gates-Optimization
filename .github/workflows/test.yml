name: tests

on:
  push:
    branches: [main]
  pull_request:          # also run on PRs, so you see failures before merging
  workflow_dispatch:     # adds a manual "Run workflow" button

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false   # let every Python version finish so you see the full picture
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip     # caches downloads between runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip show ortools openai

      - name: Run tests
        run: python -m unittest tests.test_integration -v
